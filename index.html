<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ticker Tape: The Roaring Twenties Stock Market Game</title>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6eee9;--card:#fbfdfb;--ink:#10302f;--mute:#4b6665;--gold:#a67c00;--gold2:#e3b923;--red:#b3261e;--grn:#1b6e3c;--line:#b9cbc3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c211f;--card:#14312e;--ink:#eef3ee;--mute:#9db7b1;--gold:#e3b923;--gold2:#e3b923;--red:#ff8a80;--grn:#6fdc9a;--line:#2d514c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c211f;--card:#14312e;--ink:#eef3ee;--mute:#9db7b1;--gold:#e3b923;--gold2:#e3b923;--red:#ff8a80;--grn:#6fdc9a;--line:#2d514c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Source Sans 3",system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}
h1,h2{font-family:Limelight,Georgia,serif;font-weight:400;margin:.2em 0;letter-spacing:.02em}
h1{font-size:2.3rem;line-height:1.1}h2{font-size:1.5rem}
.top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;border-bottom:3px double var(--gold);padding-bottom:8px;margin-bottom:12px}
.yr{font-family:Limelight,Georgia,serif;font-size:2.6rem;color:var(--gold);line-height:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin:12px 0}
.news{border-left:6px solid var(--gold2)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stats div{flex:1 1 120px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.stats b{display:block;font-size:1.3rem}
.stats span{color:var(--mute);font-size:.85rem}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mute);font-weight:600;font-size:.85rem}
.up{color:var(--grn);font-weight:700}.dn{color:var(--red);font-weight:700}
button{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 12px;min-height:40px}
button:hover:not(:disabled){background:var(--gold2);color:#10302f;border-color:#10302f}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.big{background:var(--ink);color:var(--bg);padding:10px 22px;font-size:1.1rem}
.big:hover:not(:disabled){background:var(--gold2);color:#10302f}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.right{background:var(--grn);color:#fff;border-color:var(--grn)}
.opt.wrong{background:var(--red);color:#10302f;border-color:var(--red)}
.warn{border-left:6px solid var(--red)}
.tiny{font-size:.9rem;color:var(--mute)}
dl{margin:0}dt{font-weight:700;margin-top:6px}dd{margin:0}
.crash{font-family:Limelight,Georgia,serif;color:var(--red);font-size:2rem}
</style>
</head>
<body>
<main id="app"></main>
<script>
const S=[{n:"Motor Co.",e:"🚗"},{n:"Radio Corp.",e:"📻"},{n:"Power & Light",e:"💡"},{n:"Movie Studios",e:"🎬"},{n:"Steel Works",e:"🏭"},{n:"Railroads",e:"🚂"},{n:"Bank Trust",e:"🏦"},{n:"Farm Equipment",e:"🚜"}];
const Y=[
{y:1920,h:"Radio goes on the air!",f:"KDKA in Pittsburgh begins broadcasting. Also, the 19th Amendment gives women the right to vote, and Prohibition bans alcohol.",c:[4,15,4,3,2,-6,3,-8],
q:["Which amendment gave women the right to vote?",["15th","19th","21st"],1,"The 19th Amendment (1920) gave women the right to vote."]},
{y:1921,h:"Henry Ford’s assembly line cuts prices",f:"On an assembly line, each worker does one job as the car moves past. Cars get cheaper, so more families can buy one.",c:[10,20,6,5,-12,-8,4,-10],
q:["What did Henry Ford’s assembly line do?",["Made cars cheaper to build","Made cars more expensive","Replaced all workers with horses"],0,"Faster production lowered the price of the Model T."]},
{y:1922,h:"Radios appear in millions of homes",f:"People hear news, music, and sports from far away. Companies use radio to advertise, which helps them sell more products.",c:[12,25,8,8,15,-4,10,-6],
q:["How did radio change American life?",["It made everyone move to farms","It spread news, music, and ads across the country","It ended the need for newspapers forever"],1,"Radio created a shared national culture."]},
{y:1923,h:"“Buy now, pay later!” Installment plans begin",f:"Families can buy cars and appliances by paying a little each month. Careful: you can also borrow money to buy stocks. This is called buying on margin. You can now borrow in this game!",c:[-6,18,10,10,8,-5,12,-9],
q:["What is an installment plan?",["Paying a little at a time for something you buy now","A tax on stocks","A kind of bank robbery"],0,"Installment buying let people spend money they did not have yet."]},
{y:1924,h:"“The business of America is business”",f:"President Calvin Coolidge supports business and low taxes. In New York City, Harlem becomes a center of Black art, music, and writing: the Harlem Renaissance.",c:[18,20,12,12,14,2,15,-7],
q:["What was the Harlem Renaissance?",["A war in Europe","A flowering of Black art, music, and literature","A new kind of car"],1,"Writers like Langston Hughes and musicians like Duke Ellington became famous."]},
{y:1925,h:"Jazz, flappers, and a new kind of fun",f:"Young women, called flappers, wear shorter dresses and shorter hair. Jazz music and dance halls are popular. Many Americans feel rich and modern.",c:[20,-8,15,15,18,4,18,-5],
q:["Which music became a symbol of the 1920s?",["Jazz","Opera only","Marching drums only"],0,"The Roaring Twenties are also called the Jazz Age."]},
{y:1926,h:"Electricity comes to more homes",f:"Cities and many towns get power lines. Families buy refrigerators, vacuum cleaners, and irons. Many rural farms and Southern towns still do not have electricity.",c:[15,18,20,-6,10,3,12,-4],
q:["Which new item did electricity help bring into homes?",["Refrigerators","Covered wagons","Candles"],0,"Electric appliances changed daily life, but not everyone could afford them."]},
{y:1927,h:"Lindbergh flies solo across the Atlantic",f:"Charles Lindbergh becomes a hero. Also, “talkies” (movies with sound) begin, and movie studios boom. Many Black families move North in the Great Migration to find jobs.",c:[-5,22,18,30,12,6,15,-6],
q:["What was the Great Migration?",["Black Americans moving from the South to Northern cities","Farmers moving to Mars","Soldiers returning from Asia"],0,"People hoped for better jobs and fewer unfair laws."]},
{y:1928,h:"Stock prices soar! Everyone is investing",f:"Ordinary people, not just the rich, buy stocks. Many use margin loans. This is speculation: buying something hoping prices will keep rising. Meanwhile, many farmers earn too little and struggle to pay debts.",c:[30,45,35,25,28,15,30,-3],
q:["What is speculation?",["Buying something hoping prices keep going up","Saving money in a jar","Paying taxes"],0,"Speculation is risky. If prices fall, you can lose a lot."]},
{y:1929,h:"Warning signs: prices are too high",f:"Some experts warn that stocks are worth less than their prices. Factories are making more than people can buy. Will you sell before it is too late?",c:[-66,-77,-60,-66,-55,-44,-72,-50],crash:1,
q:["Why can too much borrowing be dangerous?",["Loans must be repaid even if stock prices fall","Banks give free money","Stocks never go down"],0,"If prices drop, margin loans still have to be paid back."]}];
const GL=[["Stock / share","A small piece of ownership in a company."],["Margin","Borrowing money from a broker to buy stocks."],["Speculation","Risky buying, hoping prices keep rising."],["Installment plan","Paying for something in small payments over time."],["Black Tuesday","October 29, 1929, when the stock market crashed."],["Bank run","When many people rush to take their money out of a bank."],["New Deal","President Franklin D. Roosevelt’s programs to fight the Depression."]];
const EV=[
{a:1920,b:1923,t:"Railroad workers go on strike",d:"Trains stop running, so goods and workers cannot move. Steel and cars are hurt too.",fx:{5:-25,4:-10,0:-5}},
{a:1920,b:1926,t:"Steel workers walk out",d:"Mills shut down. Car makers and railroads cannot get the steel they need.",fx:{4:-25,0:-12,5:-8}},
{a:1920,b:1928,t:"Europe buys American goods",d:"Countries rebuilding after the war buy U.S. wheat, steel, and train equipment.",fx:{7:30,4:12,5:10}},
{a:1921,b:1928,t:"Small-town banks fail",d:"Many farm banks close because farmers cannot repay their loans.",fx:{6:-25,7:-15}},
{a:1921,b:1928,t:"Drought hits the farm belt",d:"Crops dry up. Farmers earn less and stop buying new equipment.",fx:{7:-25,6:-8,5:-8}},
{a:1921,b:1928,t:"Congress cuts taxes",d:"Businesses and banks keep more of their money, and investors cheer.",fx:{6:15,0:12,4:12,3:12,2:10}},
{a:1922,b:1928,t:"New highways are built",d:"Roads connect cities. Car and steel sales jump, but fewer people ride trains.",fx:{0:20,4:15,5:-18}},
{a:1922,b:1928,t:"Radio craze sweeps the country",d:"Families rush to buy radios. Power companies sell more electricity too.",fx:{1:35,2:8}},
{a:1924,b:1928,t:"A blockbuster movie breaks records",d:"Crowds fill theaters. Movie studios earn huge profits while radio loses some listeners.",fx:{3:35,1:-5}},
{a:1923,b:1924,t:"Teapot Dome oil scandal",d:"Officials are caught taking bribes for oil land. Investors lose trust in business leaders.",fx:{0:-15,6:-8,2:-10}},
{a:1924,b:1928,t:"Electric appliance craze",d:"Families buy refrigerators and irons, so power companies sell more electricity.",fx:{2:28,4:8}},
{a:1925,b:1926,t:"The Florida land bubble pops",d:"Land prices crash after wild guessing. Banks and railroads that backed the boom lose money.",fx:{6:-20,5:-12,3:-8}},
{a:1927,b:1928,t:"The Mississippi River floods",d:"Farms, rail lines, and power plants are damaged across the South and Midwest.",fx:{7:-22,5:-12,2:-10,6:-8}},
{a:1927,b:1928,t:"Ford unveils the Model A",d:"A stylish new car sends buyers rushing to showrooms.",fx:{0:28,4:15,5:-8}},
{a:1928,b:1929,t:"Interest rates go up",d:"Borrowing gets more expensive. Banks, car makers, and steel mills slow down.",fx:{6:-15,0:-10,4:-10}},
{a:1929,b:1929,t:"Experts warn prices are too high",d:"Some bankers say stocks are overpriced. Nervous investors begin to sell.",fx:{6:-18,0:-12,1:-15,3:-12,4:-10,2:-8}}];
function sched(){const used=new Set();return Y.map(r=>{const ok=EV.filter(e=>r.y>=e.a&&r.y<=e.b),pool=ok.filter(e=>!used.has(e)),c=pool.length?pool:ok,e=c[Math.floor(rnd()*c.length)];used.add(e);return{e,half:r.crash?0:Math.floor(rnd()*2)}})}
function evCard(){const e=g.ev;if(!e)return"";return `<div class="card news" role="alert"><b>Breaking news: ${e.t}</b><p style="margin:.3em 0">${e.d}</p><p style="margin:0">${Object.keys(e.fx).map(k=>`${S[k].e} ${S[k].n} <span class="${e.fx[k]>0?"up":"dn"}">${e.fx[k]>0?"▲ +":"▼ "}${e.fx[k]}%</span>`).join(" &nbsp; ")}</p></div>`}
let g,rnd=Math.random;
function start(){init();play()}
const $=id=>document.getElementById(id), app=$("app");
const m=n=>(n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString();
function init(){g={i:0,half:0,cash:1000,loan:0,sh:[0,0,0,0,0,0,0,0],p:[50,20,40,30,45,35,60,25],prev:[50,20,40,30,45,35,60,25],ans:null,ev:null,sch:sched()};roll()}
function roll(){const r=Y[g.i];g.nd=g.p.map(()=>r.crash?(g.half?0:4+rnd()*12-6):rnd()*24-12);g.nd=g.nd.map((d,k)=>r.crash&&g.half?r.c[k]:r.crash?d:r.c[k]/2+d)}
function tip(){const r=Y[g.i];if(g.ans!==r.q[2])return"";let b=0;g.nd.forEach((d,k)=>{if(Math.abs(d)>Math.abs(g.nd[b]))b=k});return `<div class="card"><b>Analyst tip</b><p style="margin:.3em 0">${S[b].e} ${S[b].n} looks likely to go <b>${g.nd[b]>0?"up":"down"}</b> in the next round.</p></div>`}
const worth=()=>g.cash+g.sh.reduce((a,n,k)=>a+n*g.p[k],0)-g.loan;
function intro(){app.innerHTML=`<div class="top"><h1>Ticker Tape</h1><span class="tiny">A Roaring Twenties stock market game</span></div>
<div class="card"><h2>Your mission</h2><p>It is 1920. World War I is over and America is booming. You have <b>$1,000</b> to invest. Each year has two rounds: spring and fall. Read the news, answer the history question to earn an <b>analyst tip</b>, and buy or sell shares in eight industries. Prices move every round, and they can go <b>up or down</b>. Some industries, like farming, struggled even in the boom.</p>
<p>From 1923 you may <b>borrow money to buy more stocks</b> (buying on margin). Loans cost <b>5% interest</b> each year, and every trade has a <b>$1 broker fee</b>. Once a year, a surprise <b>national event</b> will hit the market with no warning. Can you grow your money and still be safe when the market changes?</p>
<p class="tiny">Social Studies: United States History II. Covers the Roaring Twenties (new technology, Harlem Renaissance, Great Migration, changing culture), causes of the stock market crash, and the start of the Great Depression.</p>
<button class="big" onclick="start()">Start in 1920</button></div>
<div class="card"><h2>Word bank</h2><dl>${GL.map(x=>`<dt>${x[0]}</dt><dd>${x[1]}</dd>`).join("")}</dl></div>`}
function play(){const r=Y[g.i],e=worth(),canB=r.y>=1923;
const q=r.q,sp=g.half===0;
app.innerHTML=`<div class="top"><div class="yr">${sp?"Spring":"Fall"} ${r.y}</div><span class="tiny">Round ${g.i*2+g.half+1} of 20</span></div>
<div class="card news"><b>${r.h}</b><p style="margin:.3em 0 0">${r.f}</p></div>
<div class="stats"><div><b>${m(g.cash)}</b><span>Cash</span></div><div><b>${m(g.loan)}</b><span>Margin loan owed</span></div><div><b>${m(e)}</b><span>Net worth</span></div></div>
${sp?"":`<div class="card"><b>Mid-year market update</b><p class="tiny" style="margin:.3em 0">Prices moved again. Some stocks went down while others went up. Check your risks before you trade!</p></div>`}<div class="card" ${sp?"":"hidden"}><b>History question (right answer = analyst tip)</b><p style="margin:.3em 0">${q[0]}</p>
${q[1].map((o,k)=>`<button class="opt ${g.ans===null?"":k===q[2]?"right":k===g.ans?"wrong":""}" ${g.ans!==null?"disabled":""} onclick="ask(${k})">${o}</button>`).join("")}
<p id="fb" class="tiny" role="status">${g.ans===null?"":(g.ans===q[2]?"Correct! You earned an analyst tip. ":"Not quite. ")+q[3]}</p></div>
${evCard()}${tip()}<div class="card tw"><table><tr><th>Company</th><th>Price</th><th>Change</th><th>You own</th><th>Trade ($1 fee)</th></tr>
${S.map((s,k)=>{const d=g.p[k]-g.prev[k];return`<tr><td>${s.e} ${s.n}</td><td>${m(g.p[k])}</td><td class="${d>0?"up":d<0?"dn":""}">${(g.i||g.half)&&d?(d>0?"▲ ":"▼ ")+m(Math.abs(d)):"–"}</td><td>${g.sh[k]}</td>
<td><button ${g.cash<g.p[k]+1?"disabled":""} onclick="buy(${k})">Buy 1</button> <button ${g.sh[k]<1?"disabled":""} onclick="sell(${k})">Sell 1</button></td></tr>`}).join("")}</table></div>
<div class="card"><b>Margin loan</b> ${canB?`<span class="tiny">(borrow up to your net worth)</span><br><button style="margin-top:6px" ${g.loan+200>e?"disabled":""} onclick="loan(200)">Borrow $200</button> <button ${g.loan<1||g.cash<1?"disabled":""} onclick="loan(-200)">Repay $200</button>`:`<span class="tiny">Margin loans open in 1923.</span>`}</div>
<button class="big" onclick="next()">${sp?"Go to fall "+r.y:r.crash?"Move into October 1929":"Go to spring "+(r.y+1)}</button>`}
function ask(k){g.ans=k;play()}
function buy(k){if(g.cash>=g.p[k]+1){g.cash-=g.p[k]+1;g.sh[k]++;play()}}
function sell(k){if(g.sh[k]>0){g.cash+=g.p[k]-1;g.sh[k]--;play()}}
function loan(a){if(a<0){a=-Math.min(200,g.loan,Math.floor(g.cash))}g.loan+=a;g.cash+=a;play()}
function next(){const r=Y[g.i];g.prev=g.p.slice();
const sc=g.sch[g.i],hit=sc.half===g.half?sc.e:null;g.ev=hit;
g.p=g.p.map((p,k)=>Math.max(1,Math.round(p*(1+g.nd[k]/100)*(1+(hit?hit.fx[k]||0:0)/100))));
if(g.half===0){g.half=1;roll();play();return}
g.cash-=Math.round(g.loan*.05);
if(r.crash)return crash();
g.i++;g.half=0;g.ans=null;roll();play()}
function crash(){const e=worth(),broke=e<0,gain=e-1000;
let tier=broke?"You lost everything and still owed money. That is what happened to many real margin investors.":e<500?"You lost more than half your money.":e<1000?"You lost some money.":"You ended with more than you began. Many real investors were not so lucky.";
const stock=g.sh.reduce((a,n,k)=>a+n*g.p[k],0);
app.innerHTML=`<div class="top"><div class="crash">Black Tuesday</div><span class="tiny">October 29, 1929</span></div>
<div class="card warn"><p>Panic! Millions of shares are sold in one day. Prices plunge. People who borrowed on margin must repay loans with money they no longer have.</p>
<div class="tw"><table><tr><th>Company</th><th>Before</th><th>After</th></tr>${S.map((s,k)=>`<tr><td>${s.e} ${s.n}</td><td>${m(g.prev[k])}</td><td class="dn">${m(g.p[k])}</td></tr>`).join("")}</table></div></div>
<div class="card ${gain>0?"":"warn"}"><h2>${gain>0?"You win!":"You lose."}</h2><p class="tiny" style="margin:0 0 6px">To win, you need more than your starting $1,000 <b>after</b> repaying your loan.</p>
<div class="tw"><table style="min-width:0"><tr><td>Cash on hand</td><td>${m(g.cash)}</td></tr><tr><td>+ Shares at crash prices</td><td>${m(stock)}</td></tr><tr><td>− Margin loan you must repay</td><td class="${g.loan?"dn":""}">-${m(g.loan)}</td></tr><tr><td><b>Final net worth</b></td><td><b>${m(e)}</b></td></tr><tr><td>Compared to your $1,000</td><td class="${gain>0?"up":"dn"}"><b>${gain>0?"+":""}${m(gain)}</b></td></tr></table></div>
${broke?`<p class="dn" style="margin:8px 0 0">Even after selling everything, you still owe ${m(-e)}. This is how margin loans ruined many families.</p>`:""}</div>
<div class="card"><b>${tier}</b></div>
<div class="card"><h2>What happened next</h2><dl>
<dt>Banks fail</dt><dd>Many banks had invested depositors’ money in stocks. Bank runs began and thousands of banks closed, so people lost their savings.</dd>
<dt>Businesses and jobs disappear</dt><dd>With less spending, factories closed. About one in four workers had no job by 1933.</dd>
<dt>Many causes, not just one</dt><dd>Historians say the crash helped cause the Great Depression, along with overproduction, farm problems, unequal wealth, heavy debt, and weak banks.</dd>
<dt>Government responds</dt><dd>President Hoover’s efforts were not enough. In 1933 President Franklin D. Roosevelt began the New Deal. It created the FDIC to protect bank savings and the SEC to make stock trading fairer.</dd></dl></div>
<div class="card"><h2>Think it over</h2><p>1. Which choices made the crash hurt you more (or less)?<br>2. How did installment buying and margin loans make the economy fragile?<br>3. What rules today protect savers? (Hint: FDIC and SEC.)</p></div>
<button class="big" onclick="intro()">Play again</button>`}
intro();
</script>
</body>
</html>
